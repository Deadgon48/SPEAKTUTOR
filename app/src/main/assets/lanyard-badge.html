        * { box-sizing: border-box; }

          left: 24px;
          width: 44px;
          height: 44px;
          border-radius: 50%;

        .lanyard-flip:focus-visible { outline:2px solid #2563eb; outline-offset:2px; }
        .lanyard-flip svg { transition: transform .5s; }

    (function () {

      function integrate(pts, dt, gravity, damping) {

      function defaultFaces(opts, s) {

        const details=document.createElement('div'); details.style.cssText='position:absolute;left:'+22*s+'px;top:'+70*s+'px;color:'+opts.strapColor;

        const nm=document.createElement('div'); nm.textContent=opts.name; nm.style.cssText='font-family:'+DISPLAY+';font-weight:700;font-size:'+17*s+'px;line-height:1.05;text-transform:uppercase'; details.appendChild(nm);
        const role=document.createElement('div'); role.textContent=opts.role; role.style.cssText='font-size:'+7*s+'px;margin-top:'+3*s+'px;letter-spacing:.14em;text-transform:uppercase;opacity:.7'; details.appendChild(role); back.appendChild(details);
        const base=document.createElement('div'); base.style.cssText='position:absolute;overflow:hidden;left:0;right:0;bottom:0;height:44%;background:'+opts.strapColor+';border-top-left-radius:'+(40*s)+'px;color:'+opts.cardColor;
        const baseOrn=ornament(); baseOrn.style.cssText='position:absolute;width:'+230*s+'px;left:'+(-20*s)+'px;top:'+(-40*s)+'px;opacity:.85;max-width:none'; base.appendChild(baseOrn);
        const ba=arrow(); ba.style.cssText='position:absolute;width:'+12*s+'px;height:'+220*s+'px;left:'+150*s+'px;top:'+(-40*s)+'px;transform:rotate(62deg);max-width:none'; base.appendChild(ba); back.appendChild(base);

        const spin={a:0,v:0}; let spinTarget=0;
        const add=(x,y,w)=>{pts.push({x,y,px:x,py:y,w});return pts.length-1;};
        const strand=(from,to,n,slack)=>{const a=pts[from],b=pts[to],rest=Math.hypot(b.x-a.x,b.y-a.y)*slack/n,ids=[from];for(let i=1;i<n;i++)ids.push(add(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n,1));ids.push(to);for(let i=0;i<n;i++)links.push([ids[i],ids[i+1],rest]);return {ids,rest};};

          const B=pts[iB],T=pts[iT],ang=Math.atan2(T.x-B.x,T.y-B.y),u=Math.max(14,Math.round(cw*.1))/20;ctx.setTransform(dpr,0,0,dpr,B.x*dpr,B.y*dpr);ctx.rotate(-ang);ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=6*dpr;ctx.shadowOffsetY=2*dpr;ctx.fillStyle=metal(-16*u,0,16*u,0);ctx.beginPath();ctx.roundRect(-15*u,-14*u,30*u,17*u,3*u);ctx.fill();ctx.beginPath();ctx.roundRect(-11*u,1*u,22*u,15*u,[2*u,2*u,6*u,6*u]);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle='rgba(40,36,30,.55)';ctx.fillRect(-10*u,-9*u,20*u,2.2*u);ctx.fillRect(-5*u,6*u,10*u,3*u);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=.8*u;ctx.beginPath();ctx.moveTo(-13*u,-12.5*u);ctx.lineTo(13*u,-12.5*u);ctx.stroke();

        let drag=null;

        let last=performance.now(),acc=0,t=0;

      }

      window.createLanyardBadge = createLanyardBadge;

      // 1. LEER PARÁMETROS
      const params = new URLSearchParams(window.location.search);
      const userName = params.get('nombre') || 'PACIENTE ESTRELLA';
      const temaSeleccionado = params.get('tema') || 'clasico';

      // 2. DICCIONARIO DE TEMAS PARA EL GAFETE
      const THEMES = {
        clasico: { card: '#e8dfcc', strap: '#141312', ink: '#b59a6c', font: "'BloclkStepped', sans-serif" },
        diamante: { card: '#0f172a', strap: '#00f0ff', ink: '#00f0ff', font: "'Blox2', sans-serif" },
        retro: { card: '#222222', strap: '#39ff14', ink: '#ff9900', font: "'Blox2', sans-serif"  },
        oro: { card: '#f3e3ac', strap: '#333333', ink: '#d4af37', font: "'Blox2', sans-serif"  },
        esmeralda: { card: '#d1fae5', strap: '#064e3b', ink: '#059669', font: "'Blox2', sans-serif"  },
        rpg: { card: '#3a0909', strap: '#d4af37', ink: '#ffcccb', font: "'Blox2', sans-serif"  }
      };
      const activeTheme = THEMES[temaSeleccionado] || THEMES['clasico'];

      // Cambiar color de fondo del body para que combine
      document.body.style.background = activeTheme.card === '#0f172a' || activeTheme.card === '#222222' || activeTheme.card === '#3a0909' ? '#111' : '#f4f4f5';

      createLanyardBadge(document.getElementById('badge'), {
        name: userName,
        title: 'SpeakTutor Pro',
        subtitle: 'Fluidez · Constancia',
        role: temaSeleccionado === 'rpg' ? 'Rango Leyenda' : (temaSeleccionado === 'diamante' ? 'Hacker Vocal' : 'Paciente VIP'),
        strapText: 'terapia de fluidez y lenguaje',
        strapLabel: 'SPEAK TUTOR 2026',
        cardColor: activeTheme.card,
        strapColor: activeTheme.strap,
        inkColor: activeTheme.ink
      });

      window.addEventListener('load', () => { rebuild(); });
    })();
